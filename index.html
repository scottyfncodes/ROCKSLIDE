<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>ROCKSLIDE: Mountain Patrol</title>
    <meta name="description" content="Look after an alpine valley: rescue people, control avalanches, fly recon, and build up your mountain patrol station with Koda the husky." />
    <meta name="application-name" content="ROCKSLIDE" />
    <meta name="theme-color" content="#4a2330" />
    <meta name="color-scheme" content="dark" />

    <!-- installable / home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ROCKSLIDE" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ROCKSLIDE" />
    <meta property="og:title" content="ROCKSLIDE: Mountain Patrol" />
    <meta property="og:description" content="An alpine mountain patrol adventure: a snowmobile, a helicopter, skis, a husky called Koda and a valley to look after." />
    <meta property="og:url" content="https://rockslide-game.vercel.app/" />
    <meta property="og:image" content="https://rockslide-game.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kessel Patrol emblem and the ROCKSLIDE wordmark beside the patrol lodge at dusk, with Vince and Koda in the snow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ROCKSLIDE: Mountain Patrol" />
    <meta name="twitter:description" content="Your valley, your station, your husky. Keep the mountain safe." />
    <meta name="twitter:image" content="https://rockslide-game.vercel.app/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400..800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main aria-label="ROCKSLIDE: Mountain Patrol">
    <canvas id="view" role="img" aria-label="The Kessel valley in 3D: you, Koda and the mountain. Your objective, the radio and every control are in the panels around it."></canvas>
    <div id="grade" aria-hidden="true"></div>
    <div id="ui"></div>

    <div id="loading" class="screen" role="status" aria-label="Loading the valley">
      <div class="loading-inner">
        <img class="emblem" src="/icons/icon.svg" alt="" width="96" height="96" />
        <div class="wordmark" role="img" aria-label="ROCKSLIDE"><span class="wm-top" aria-hidden="true">ROCKSLIDE</span><span class="wm-bot" aria-hidden="true">ROCKSLIDE</span></div>
        <div class="subbrand">Mountain Patrol</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <div class="loading-text label">Loading the valley</div>
      </div>
    </div>
    </main>
    <noscript>ROCKSLIDE needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
