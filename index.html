<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SNOW PATROL: Kessel Valley</title>
    <meta name="description" content="Look after an alpine valley: rescue people, control avalanches, fly recon, and build up your mountain patrol station with Koda the husky." />
    <meta name="application-name" content="SNOW PATROL" />
    <meta name="theme-color" content="#4a2330" />
    <meta name="color-scheme" content="dark" />

    <!-- installable / home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SNOW PATROL" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SNOW PATROL" />
    <meta property="og:title" content="SNOW PATROL: Kessel Valley" />
    <meta property="og:description" content="An alpine mountain patrol adventure: a snowmobile, a helicopter, skis, a husky called Koda and a valley to look after." />
    <meta property="og:url" content="https://rockslide-game.vercel.app/" />
    <meta property="og:image" content="https://rockslide-game.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Kessel Patrol emblem and the SNOW PATROL wordmark beside the patrol lodge at dusk, with Vince and Koda in the snow." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SNOW PATROL: Kessel Valley" />
    <meta name="twitter:description" content="Your valley, your station, your husky. Keep the mountain safe." />
    <meta name="twitter:image" content="https://rockslide-game.vercel.app/og-image.jpg" />

    <!-- the fonts are served with the game (src/ui/fonts.css); Jost sets the title card, so it starts loading
         first. Loaded through the FontFace API rather than a <link rel=preload>: same early fetch, but a reload
         from the cache never leaves an "unused preload" behind it (Chrome warns when the cached font face
         answers before the preload does). -->
    <script>
      try {
        new FontFace('Jost', "url('/fonts/jost-latin-wght-normal.woff2') format('woff2')", { weight: '100 900', display: 'swap', unicodeRange: 'U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD' }).load().then((f) => document.fonts.add(f), () => {});
      } catch (e) {}
    </script>
    <!-- HaveAnApp Pulse: anonymous, cookieless usage counts. -->
    <script defer src="https://haveanapp-pulse-collect.vercel.app/p.js" data-app="snow-patrol"></script>
    <script>window.pulse=window.pulse||function(){(pulse.q=pulse.q||[]).push(arguments)}</script>
  </head>
  <body>
    <main aria-label="SNOW PATROL: Kessel Valley">
    <canvas id="view" role="img" aria-label="The Kessel valley in 3D: you, Koda and the mountain. Your objective, the radio and every control are in the panels around it."></canvas>
    <div id="grade" aria-hidden="true"></div>
    <div id="ui"></div>

    <div id="loading" class="screen" role="status" aria-label="Loading the valley">
      <div class="loading-inner">
        <img class="emblem" src="/icons/icon.svg" alt="" width="96" height="96" />
        <div class="wordmark" role="img" aria-label="SNOW PATROL"><span class="wm-top" aria-hidden="true">SNOW PATROL</span><span class="wm-bot" aria-hidden="true">SNOW PATROL</span></div>
        <div class="subbrand">Kessel Valley</div>
        <div class="loading-bar"><div class="loading-fill"></div></div>
        <div class="loading-text label">Loading the valley</div>
      </div>
    </div>
    </main>
    <noscript>SNOW PATROL needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
